name: JMA Typhoon Fetch

on:
  workflow_dispatch: {}
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: jma-typhoon-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch JMA typhoon data
        run: python src/fetch_jma_typhoon.py

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- data/jma_typhoon.json; then
            echo "No JMA data change. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jma_typhoon.json
          git commit -m "Update JMA typhoon data"
          git push
