name: Flight Status Fetch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-flight-status
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ICN to PVG flights
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
        run: python src/fetch_flights.py

      - name: Commit flight status
        shell: bash
        run: |
          if [ ! -f data/flights.json ]; then
            echo "data/flights.json was not created."
            exit 1
          fi

          git add data/flights.json

          if git diff --cached --quiet; then
            echo "No flight data change. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update manual flight status"
          git push
