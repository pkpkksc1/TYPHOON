name: Flight Status Update

on:
  workflow_dispatch:

  schedule:
    # 매일 한국시간 06:00 실행
    # GitHub Actions cron은 UTC 기준
    # KST 06:00 = UTC 21:00 (전날)
    - cron: "0 21 * * *"


permissions:
  contents: write


concurrency:
  group: daily-flight-status
  cancel-in-progress: false


jobs:
  fetch-flight-status:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Fetch flight status
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}

        run: |
          python src/fetch_flights.py


      - name: Check flight data
        run: |
          cat data/flights.json


      - name: Commit flight data

        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add data/flights.json


          git diff --cached --quiet || git commit -m "Update daily flight status"


          git push
