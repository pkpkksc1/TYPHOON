name: SBLC Auto Mail Send v8.69.2


on:

  workflow_dispatch:

  schedule:
    # 한국시간(KST)
    # 01:00 / 07:00 / 13:00 / 19:00
    # GitHub Actions UTC 기준
    # KST - 9시간
    - cron: "0 4,10,16,22 * * *"


permissions:
  contents: write


concurrency:
  group: sblc-auto-mail-send
  cancel-in-progress: false


jobs:

  send-dashboard-mail:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"



      # 1단계
      # 최신 항공/태풍 데이터 기준 dashboard 생성
      - name: Build dashboard data v8.69.2
        run: |
          python src/build_dashboard.py



      # 2단계
      # 메일용 오프라인 HTML 생성
      - name: Build offline dashboard
        run: |
          python src/build_offline_dashboard.py



      # 3단계
      # 화면 캡처 이미지 생성
      - name: Capture dashboard image
        run: |
          python src/capture_dashboard.py



      # 4단계
      # 메일 발송
      - name: Send dashboard email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          python src/send_dashboard_email.py



      # 5단계
      # dashboard 데이터 저장
      - name: Commit dashboard data

        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add data/dashboard.json


          git diff --cached --quiet || git commit -m "Update dashboard mail v8.69.2"


          git push
