name: SBLC Dashboard Mail Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-mail-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build offline dashboard
        run: python src/build_offline_dashboard.py

      - name: Check generated attachment
        run: |
          test -f output/typhoon_dashboard_offline.html
          ls -lh output/typhoon_dashboard_offline.html

      - name: Send dashboard email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python src/send_dashboard_email.py
